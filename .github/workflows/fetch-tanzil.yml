name: fetch-tanzil

# ينزّل نص القرآن من tanzil.net ويتحقق منه ويحفظه بـ remotion/public/quran
on:
  workflow_dispatch:
  push:
    paths:
      - remotion/scripts/fetch-tanzil.mjs
      - .github/workflows/fetch-tanzil.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and validate
        run: node remotion/scripts/fetch-tanzil.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add remotion/public/quran
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Quran text from Tanzil"
            git push origin HEAD:${{ github.ref_name }}
          fi
